<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Deriva migratoria — Diagrama</title>
  <link rel="stylesheet" href="diagrama.css">
</head>

<body>

  <div id="space">

    <div class="gallery">

      <!-- LA OBRA -->
      <div class="card" data-id="obra">
        <div class="card-inner">
          <div class="card-front">
            <img class="front-icon" src="assets/img/dm_obra.PNG" alt="La obra">
          </div>
          <div class="card-back">
            <img src="assets/img/obra.JPG" alt="">
          </div>
        </div>
      </div>

      <!-- AUTOR -->
      <div class="card" data-id="autor">
        <div class="card-inner">
          <div class="card-front">
            <img class="front-icon" src="assets/img/dm_autor.PNG" alt="Autor">
          </div>
          <div class="card-back">
            <img src="assets/img/autor.JPG" alt="">
          </div>
        </div>
      </div>

      <!-- MAGNETORRECEPCIÓN -->
      <div class="card" data-id="magneto">
        <div class="card-inner">
          <div class="card-front">
            <img class="front-icon" src="assets/img/dm_aves.PNG" alt="Magnetorrecepción">
          </div>
          <div class="card-back">
            <img src="assets/img/aves.JPG" alt="">
          </div>
        </div>
      </div>

      <!-- COSMOTECNIA -->
      <div class="card" data-id="cosmo">
        <div class="card-inner">
          <div class="card-front">
            <img class="front-icon" src="assets/img/dm_cosmo.PNG" alt="Cosmotecnia">
          </div>
          <div class="card-back">
            <img src="assets/img/cosmo.JPG" alt="">
          </div>
        </div>
      </div>

      <!-- TECNODIVERSIDAD -->
      <div class="card" data-id="tecno">
        <div class="card-inner">
          <div class="card-front">
            <img class="front-icon" src="assets/img/dm_tecno.PNG" alt="Tecnodiversidad">
          </div>
          <div class="card-back">
            <img src="assets/img/tecno.JPG" alt="">
          </div>
        </div>
      </div>

      <!-- ORGANISMO -->
      <div class="card" data-id="organismo">
        <div class="card-inner">
          <div class="card-front">
            <img class="front-icon" src="assets/img/dm_organ.PNG" alt="Organismo cibernético">
          </div>
          <div class="card-back">
            <img src="assets/img/organ.JPG" alt="">
          </div>
        </div>
      </div>

      <!-- REINICIO -->
      <div class="card restart">
        <div class="card-inner">
          <div class="card-front">
            <img class="front-icon restart-icon" src="assets/img/icono.PNG" alt="Repetir experiencia">
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Audio ambiente -->
  <audio id="diagramSound" src="assets/aud/birds.mp3" loop preload="auto"></audio>

  <div id="overlay"></div>

  <script src="diagrama.js"></script>
</body>
</html>
